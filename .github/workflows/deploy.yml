name: 배포 및 테스트

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # 의존성 설치, 빌드, 테스트 작업
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 체크아웃
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. 의존성 설치
      - name: 의존성 설치
        run: npm ci

      # 4. ESLint 검사
      - name: ESLint 검사
        run: npm run lint
        continue-on-error: true

      # 5. TypeScript 타입 검사
      - name: TypeScript 타입 검사
        run: npx tsc --noEmit

      # 6. 빌드 테스트
      - name: 빌드 테스트
        run: npm run build
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      # 7. 보안 검사 (npm audit)
      - name: 보안 검사
        run: npm audit
        continue-on-error: true

  # 메인 브랜치에만 Vercel 배포
  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # 1. 저장소 체크아웃
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. 의존성 설치
      - name: 의존성 설치
        run: npm ci

      # 4. Vercel 배포
      - name: Vercel 배포
        uses: vercel/action@v6
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.GA_ID }}

      # 5. 배포 성공 알림
      - name: 배포 성공
        if: success()
        run: echo "✅ Vercel 배포 완료!"
